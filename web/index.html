<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: https: http:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"><title>Rich Markdown Diff</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">M<span>±</span></span><div>Rich Markdown Diff<small>문서의 변화를 읽다</small></div></div><button id="open">저장소 열기… <kbd>⌘O</kbd></button><span id="repository" title=""></span><button id="pause">Ⅱ 자동 갱신 중</button></header>
<div class="workspace"><aside><div class="aside-title">변경된 문서 <span id="file-count">0</span></div><label class="compare-label" for="mode">비교 기준</label><select id="mode"><option value="total">전체 변경 · HEAD → 현재</option><option value="unstaged">스테이징 전 · 인덱스 → 현재</option><option value="staged">스테이징됨 · HEAD → 인덱스</option><option value="commit">선택한 커밋 → 현재</option></select><div id="commit-picker" hidden><label class="compare-label" for="commit-history">비교할 커밋 · 최근 200개</label><select id="commit-history" aria-label="비교할 커밋"><option value="">최근 커밋에서 선택…</option></select><div class="commit-entry"><input id="commit-input" type="text" maxlength="512" placeholder="해시, 태그, HEAD~1" aria-label="커밋 해시 또는 참조" spellcheck="false" autocomplete="off"><button id="commit-apply" disabled>비교</button></div><div id="commit-base"></div><p id="commit-message" role="status" aria-live="polite"></p></div><nav id="files" aria-label="변경 파일"></nav><div class="aside-footer"><span class="dot"></span> 읽기 전용 Git 뷰어</div></aside>
<main><div class="toolbar"><div id="filename">문서를 선택하세요</div><div class="controls"><div class="segmented"><button id="unified" class="active">통합형</button><button id="split">좌우형</button></div><label><input id="only" type="checkbox"> 변경만</label><button id="prev" title="이전 변경">↑</button><button id="next" title="다음 변경">↓</button><span id="counter">0 / 0</span><button id="comments-toggle" aria-expanded="false">코멘트 <span id="comment-count">0</span></button></div></div><div class="legend"><span class="del-text">− 삭제</span><span class="add-text">+ 추가</span><span class="format-text">◇ 서식·원문 변경</span><span id="versions"></span></div><div class="review-layout"><div id="viewport" tabindex="0"><div id="empty"><span class="empty-icon">M±</span><h1>문서의 변화를 한눈에</h1><p>로컬 Git 저장소를 열어 마크다운 변경을 살펴보세요.</p><button id="empty-open">저장소 열기…</button></div><div id="rows"></div></div><section id="comment-panel" aria-label="문서 코멘트" hidden>
<div class="comment-heading"><strong>문서 코멘트 <span id="panel-comment-count">0</span></strong><button id="comments-close" aria-label="코멘트 패널 닫기">×</button></div>
<div class="comment-panel-body"><div class="comment-top-actions"><button id="comments-copy-all">모두 복사</button><span id="comments-message" role="status" aria-live="polite"></span></div>
<details id="comment-compose"><summary>＋ 코멘트 작성</summary><div id="comment-form"><label class="field-label" for="comment-side">원문 기준</label><select id="comment-side"><option value="after">변경 후</option><option value="before">변경 전</option></select>
<div class="line-range"><label>시작 라인 <input id="comment-start" type="number" min="1" value="1"></label><span>–</span><label>끝 라인 <input id="comment-end" type="number" min="1" value="1"></label></div>
<details id="source-picker"><summary>원문 라인 선택 <small>Shift+클릭으로 범위 선택</small></summary><div id="comment-source" role="group" aria-label="Markdown 원문 라인"></div></details>
<pre id="comment-excerpt" aria-label="선택한 원문"></pre><label class="field-label" for="comment-body">코멘트</label><textarea id="comment-body" rows="3" placeholder="선택한 라인에 대한 코멘트를 입력하세요."></textarea><div class="comment-submit-row"><button id="comment-cancel-edit" hidden>수정 취소</button><button id="comment-submit">코멘트 추가</button></div></div></details>
<div id="comment-list" aria-label="현재 문서의 코멘트"></div></div></section></div><footer><span id="status">저장소를 열어 시작하세요</span><span id="updated"></span></footer></main></div><script src="app.js"></script></body></html>
